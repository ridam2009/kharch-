<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>खर्च मित्र</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #3e8e41, #2196f3); /* Modern gradient background */
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background-color: #f5f5f5;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      color: #333;
      margin-top: 50px;
    }
    h2 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 20px;
      color: #4CAF50;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus, select:focus, button:focus {
      outline: none;
      border-color: #4CAF50;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background-color: #fff;
      margin: 10px 0;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.5s ease-out;
    }
    .total {
      font-weight: bold;
      text-align: center;
      font-size: 20px;
      margin-top: 20px;
    }
    .delete-btn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .delete-btn:hover {
      background-color: #ff3333;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>खर्च मित्र</h2>
    <input type="text" id="description" placeholder="विवरण जैसे - खाना, यात्रा"/>
    <input type="number" id="amount" placeholder="राशि ₹"/>
    <select id="category">
      <option value="भोजन">भोजन</option>
      <option value="सफर">सफर</option>
      <option value="शॉपिंग">शॉपिंग</option>
      <option value="स्वास्थ्य">स्वास्थ्य</option>
      <option value="अन्य">अन्य</option>
    </select>

    <!-- New Date Input for Date Picker -->
    <input type="date" id="date" />

    <button onclick="addExpense()">खर्च जोड़ें</button>

    <ul id="expenseList"></ul>
    <div class="total" id="totalAmount">कुल खर्च: ₹0</div>
  </div>

  <script>
    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    // जब पेज लोड हो, तो पुराने डेटा को लोड करो
    window.onload = renderExpenses;

    function renderExpenses() {
      const list = document.getElementById("expenseList");
      const totalDiv = document.getElementById("totalAmount");
      list.innerHTML = "";
      let total = 0;

      expenses.forEach((exp, index) => {
        total += exp.amount;
        const li = document.createElement("li");
        li.innerHTML = `
          ${exp.description} - ₹${exp.amount} (${exp.category}) - ${exp.date}
          <button class="delete-btn" onclick="confirmDelete(${index})">X</button>
        `;
        list.appendChild(li);
      });

      totalDiv.textContent = `कुल खर्च: ₹${total}`;
    }

    function addExpense() {
      const desc = document.getElementById("description").value;
      const amt = parseFloat(document.getElementById("amount").value);
      const cat = document.getElementById("category").value;
      const date = document.getElementById("date").value;

      if (!desc || !amt || !date) {
        alert("कृपया सभी जानकारी भरें।");
        return;
      }

      expenses.push({ description: desc, amount: amt, category: cat, date: date });
      localStorage.setItem("expenses", JSON.stringify(expenses));  // डेटा को localStorage में सेव करें
      renderExpenses();

      // इनपुट फील्ड को रीसेट करें
      document.getElementById("description").value = "";
      document.getElementById("amount").value = "";
      document.getElementById("date").value = "";
    }

    function confirmDelete(index) {
      const confirmDelete = window.confirm("क्या आप सच में इस खर्च को हटाना चाहते हैं?");
      if (confirmDelete) {
        deleteExpense(index);
      }
    }

    function deleteExpense(index) {
      expenses.splice(index, 1); // जिस खर्च को हटाना है, उसे निकाल दो
      localStorage.setItem("expenses", JSON.stringify(expenses)); // अपडेटेड डेटा को localStorage में सेव करें
      renderExpenses();
    }
  </script>
</body>
</html>
